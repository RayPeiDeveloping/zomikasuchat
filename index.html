<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>たんご帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #ffe401;
    --sky-dark: #d9bd00;
    --sky-text: #8f7c00;
    --cream: #f2e9d6;
    --coral: #ff6f59;
    --coral-dark: #e2543e;
    --ink: #3c3c43;
    --ink-soft: #8b8fa3;
    --card-white: #ffffff;
    --row-border: #ece2c9;
    --sun: #ff9600;
    --moon: #ffd600;
    --font-head: 'Quicksand', 'Segoe UI', sans-serif;
    --font-body: 'Nunito', 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #d9d2bd;
    overscroll-behavior-y: none;
  }

  #app-root {
    height: 100vh;
    height: 100dvh;
    width: 100%;
    display: flex;
    align-items: stretch;
    justify-content: center;
    background: #d9d2bd;
    font-family: var(--font-body);
  }

  .card {
    width: 100%;
    max-width: 100%;
    height: 100%;
    background: var(--cream);
    border-radius: 0;
    border: none;
    box-shadow: none;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  @media (min-width: 560px) {
    #app-root { padding: 24px 16px; }
    .card {
      max-width: 460px;
      height: min(88vh, 760px);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    }
  }

  .btn-3d {
    border: none;
    border-radius: 14px;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    padding: 13px 18px;
    color: var(--ink);
    background: var(--sky);
    box-shadow: 0 4px 0 var(--sky-dark);
    transition: transform 0.05s ease, box-shadow 0.05s ease;
  }
  .btn-3d:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sky-dark); }
  .btn-3d:disabled { background: #c7cae0; box-shadow: 0 4px 0 #aeb2d1; cursor: not-allowed; }

  /* ---- Landing screen ---- */
  .landing {
    padding: 28px 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow-y: auto;
    background: var(--card-white);
  }
  .landing .eyebrow {
    font-family: var(--font-head);
    font-weight: 700;
    color: var(--coral);
    font-size: 13px;
    letter-spacing: 0.02em;
    margin: 0 0 6px;
  }
  .landing h1 {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 24px;
    line-height: 1.25;
    color: var(--ink);
    margin: 0 0 22px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-family: var(--font-head);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid var(--row-border);
    border-radius: 12px;
    background: var(--cream);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
    outline: none;
  }
  .field input:focus { border-color: var(--sky); }
  .room-row { display: flex; gap: 8px; }
  .room-row input { flex: 1; min-width: 0; }
  .ghost-btn {
    border: 2px solid var(--row-border);
    background: transparent;
    color: var(--ink-soft);
    padding: 0 14px;
    border-radius: 12px;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .ghost-btn:hover { border-color: var(--coral); color: var(--coral-dark); }
  .primary-btn { width: 100%; margin-top: 8px; }
  .hint { margin-top: 14px; font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; }
  .hint.warn {
    background: #fff4e5;
    color: #a15c00;
    border-radius: 10px;
    padding: 10px 12px;
    font-weight: 600;
  }

  /* ---- Main screen: top bar ---- */
  .top-bar {
    flex: 0 0 auto;
    background: var(--sky);
    padding: 10px 14px 12px;
    padding-top: max(10px, env(safe-area-inset-top));
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .back-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.08);
    color: var(--ink);
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .search-input {
    flex: 1;
    min-width: 0;
    padding: 11px 16px;
    border: none;
    border-radius: 14px;
    background: #fff;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    outline: none;
  }
  .search-input::placeholder { color: #b7bac7; }
  .search-input:disabled { opacity: 0.7; }

  /* ---- action row ---- */
  .action-row {
    flex: 0 0 auto;
    display: flex;
    gap: 10px;
    padding: 16px 14px 12px;
    background: var(--cream);
  }
  .pill-btn {
    flex: 1;
    border: 2px solid var(--sky);
    background: #fff;
    color: var(--sky-text);
    border-radius: 14px;
    padding: 12px 10px;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
  }
  .pill-btn.show-toggle.active {
    background: var(--coral);
    border-color: var(--coral);
    color: #fff;
  }

  /* ---- tabs ---- */
  .tabs {
    flex: 0 0 auto;
    display: flex;
    background: var(--card-white);
    border-radius: 14px;
    margin: 0 14px 12px;
    overflow: hidden;
    border: 2px solid var(--sky);
  }
  .tab {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--sky-text);
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 12px;
    padding: 11px 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab.active { background: var(--sky); color: var(--ink); }

  /* ---- message list styled as vocab rows ---- */
  .messages {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--cream);
  }

  .empty-state {
    margin: 40px auto;
    text-align: center;
    color: var(--ink-soft);
    font-family: var(--font-head);
    font-weight: 600;
    font-size: 14px;
    max-width: 220px;
    line-height: 1.6;
  }

  .word-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 16px 14px;
    background: var(--card-white);
    border-bottom: 1px solid var(--row-border);
  }
  .word-row-num {
    flex-shrink: 0;
    width: 18px;
    padding-top: 6px;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-soft);
    text-align: center;
  }
  .speaker-btn {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    border: none;
    background: var(--sky);
    color: var(--ink);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
  }
  .speaker-btn:active { background: var(--sky-dark); }
  .word-row-main { flex: 1; min-width: 0; }
  .word-row-english {
    font-size: 21px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.3;
    word-break: break-word;
  }
  .word-row-meaning {
    margin-top: 4px;
    font-size: 14px;
    font-weight: 600;
    color: #555b6e;
    line-height: 1.5;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .word-row-meaning.masked {
    color: #c7cbd8;
    letter-spacing: 2px;
  }
  .word-row-status {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding-top: 2px;
  }
  .status-icon { width: 28px; height: 28px; }
  .word-row-time { font-size: 9.5px; font-weight: 700; color: var(--ink-soft); }

  /* ---- bottom nav ---- */
  .bottom-nav {
    flex: 0 0 auto;
    display: flex;
    background: var(--sky);
    padding: 10px 6px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  .nav-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: rgba(60,60,67,0.5);
    font-size: 20px;
    padding: 4px 0;
    cursor: pointer;
  }
  .nav-btn.active { color: var(--ink); }

  .status-line {
    flex: 0 0 auto;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-soft);
    text-align: center;
    padding: 4px 0;
    background: var(--cream);
  }

  .error-banner, .notice-banner {
    flex: 0 0 auto;
    font-size: 12px;
    font-weight: 700;
    padding: 8px 14px;
    text-align: center;
    line-height: 1.5;
  }
  .error-banner { background: #ffe4d6; color: #a14a00; }
  .notice-banner { background: #fffbe0; color: var(--sky-text); }

  /* ---- modal sheet ---- */
  .sheet-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(20,20,30,0.4);
    display: flex;
    align-items: flex-end;
    z-index: 20;
  }
  .sheet {
    width: 100%;
    background: #fff;
    border-radius: 20px 20px 0 0;
    padding: 20px 20px max(20px, env(safe-area-inset-bottom));
    font-family: var(--font-body);
  }
  .sheet h2 {
    font-family: var(--font-head);
    font-size: 17px;
    margin: 0 0 14px;
    color: var(--ink);
  }
  .sheet-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--row-border);
    font-size: 14px;
    color: var(--ink);
    font-weight: 600;
  }
  .sheet-row:last-of-type { border-bottom: none; }
  .sheet-value { color: var(--ink-soft); font-weight: 700; }
  .toggle-switch {
    width: 44px;
    height: 26px;
    border-radius: 13px;
    border: none;
    background: #d8dbe6;
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
  }
  .toggle-switch.on { background: var(--sky); }
  .toggle-switch::after {
    content: "";
    position: absolute;
    top: 3px; left: 3px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.15s ease;
  }
  .toggle-switch.on::after { transform: translateX(18px); }
  .sheet-close {
    margin-top: 16px;
    width: 100%;
  }
  .sheet-leave {
    margin-top: 10px;
    width: 100%;
    background: transparent;
    border: 2px solid #ffb3a3;
    color: #c94b34;
    border-radius: 14px;
    padding: 11px;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .stat-big {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 36px;
    color: var(--sky-text);
    text-align: center;
    margin: 6px 0 2px;
  }
  .stat-sub {
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 14px;
  }

  /* ---- call bar / incoming call sheet ---- */
  .call-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--ink);
    color: #fff;
  }
  .call-bar-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #f5a623;
    flex-shrink: 0;
    animation: call-pulse 1.4s infinite ease-in-out;
  }
  .call-bar-dot.connected {
    background: #35d07f;
    animation: none;
  }
  @keyframes call-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  .call-notice {
    background: #35d07f;
    color: #fff;
    font-weight: 700;
  }
  .call-route-badge {
    margin-left: 8px;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(255,255,255,0.18);
    vertical-align: middle;
  }
  .call-route-badge.relay { background: rgba(245,166,35,0.35); }
  .route-log {
    flex: 0 0 auto;
    position: relative;
    background: #1e1e24;
    color: #d6f5d6;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 10.5px;
    line-height: 1.5;
    padding: 6px 30px 6px 10px;
    max-height: 120px;
    overflow-y: auto;
    word-break: break-all;
  }
  .route-log button {
    position: absolute; top: 2px; right: 4px;
    border: none; background: transparent; color: #aaa; font-size: 14px; cursor: pointer;
  }
  .call-bar-text {
    flex: 1;
    min-width: 0;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .call-bar-btn {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.18);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .call-bar-btn.hangup { background: var(--coral); }
  .call-sheet { text-align: center; }
  .call-caller {
    margin: 0 0 18px;
    font-weight: 700;
    color: var(--ink);
  }
  .call-sheet-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .call-accept { background: #35d07f; box-shadow: 0 4px 0 #23a361; }
</style>
</head>

function randomRoomCode() {
  const words = ["nami", "yuki", "sora", "hoshi", "kaze", "mori", "umi", "tsuki"];
  const w = words[Math.floor(Math.random() * words.length)];
  const n = Math.floor(1000 + Math.random() * 9000);
  return `${w}-${n}`;
}

// Deterministic ASCII-only topic name derived from the user's room code,
// so any characters (including Japanese) work as a passphrase.
function roomToTopic(room) {
  const input = room.trim().toLowerCase();
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < input.length; i++) {
    const ch = input.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  const hex = (h1 >>> 0).toString(16).padStart(8, "0") + (h2 >>> 0).toString(16).padStart(8, "0");
  return `cc-chat-${hex}`;
}

// Small stable hash so a given message id always maps to the same
// "vocabulary word", even after re-fetching or reordering.
function hashToIndex(str, mod) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = (h * 31 + str.charCodeAt(i)) >>> 0;
  }
  return h % mod;
}

function wordFor(id) {
  return WORD_BANK[hashToIndex(String(id), WORD_BANK.length)];
}

function meaningFor(id) {
  return JAPANESE_BANK[hashToIndex(String(id), JAPANESE_BANK.length)];
}

function speak(word) {
  try {
    if (!("speechSynthesis" in window)) return;
    const spoken = word.replace(/～/g, "").replace(/[()]/g, "").replace(/\//g, " or ").replace(/\s+/g, " ").trim();
    const u = new SpeechSynthesisUtterance(spoken);
    u.lang = "en-US";
    u.rate = 0.95;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) { /* speech unavailable, ignore */ }
}

function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.setValueAtTime(1180, ctx.currentTime + 0.09);
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.36);
  } catch (e) { /* audio unavailable, ignore */ }
}

const OTHER_ICON_TYPES = ["moon", "cloud", "darkCloud", "umbrella"];

  return OTHER_ICON_TYPES[hashToIndex(String(sender), OTHER_ICON_TYPES.length)];

      <div className="field">
        <label htmlFor="room">教材コード（相手と同じものを入力）</label>
        <div className="room-row">
          <input id="room" type="text" placeholder={suggested} value={room}
            onChange={(e) => setRoom(e.target.value)} maxLength={30} />
          <button className="ghost-btn" onClick={() => setRoom(suggested)}>候補を使う</button>
        </div>
      </div>

      <button className="btn-3d primary-btn" disabled={!canJoin}
        onClick={() => onJoin(name.trim(), room.trim())}>
        はじめる
      </button>

      <p className="hint">
        同じ教材コードを入力した人同士が同じ単語帳でつながります。相手にはこのページと
        教材コードを伝えてください。ページを閉じても、また同じコードで入れば続きが見られます。
      </p>
      <p className="hint warn">
        ⚠️ このアプリは公開の中継サービス（ntfy.sh）を使って通信します。暗号化はされておらず、
        教材コードを知っている人なら誰でも内容を読めます。他人に推測されにくいコードを選び、
        重要な個人情報のやり取りには使わないでください。
      </p>
    </div>
  );
}

// STUN だけでは、CGNAT や対称型NATの回線同士だと直接つながらないことがある。
// そのときの中継役として metered.ca の TURN（自分のアカウントのもの）を使う。
// 最後の turns: は本物のTLSで包まれた候補で、学校や会社のDPIファイアウォールでも通りやすい。
// ※このHTMLを見た人にはユーザー名とパスワードが見える。使用量がおかしければ
//   metered のダッシュボードで credential を作り直すこと。
const ICE_SERVERS = [
  { urls: "stun:stun.relay.metered.ca:80" },
  { urls: "turn:global.relay.metered.ca:80", username: "d8b151d52df6f9ac2ba5573e", credential: "iynHGVZ3Q3UQ7uyw" },
  { urls: "turn:global.relay.metered.ca:80?transport=tcp", username: "d8b151d52df6f9ac2ba5573e", credential: "iynHGVZ3Q3UQ7uyw" },
  { urls: "turn:global.relay.metered.ca:443", username: "d8b151d52df6f9ac2ba5573e", credential: "iynHGVZ3Q3UQ7uyw" },
  { urls: "turns:global.relay.metered.ca:443?transport=tcp", username: "d8b151d52df6f9ac2ba5573e", credential: "iynHGVZ3Q3UQ7uyw" },
];

function WordListRoom({ name, room, onLeave }) {
  const [messages, setMessages] = useState(null);
  const [draft, setDraft] = useState("");
  const [error, setError] = useState(null);
  const [sending, setSending] = useState(false);
  const [notifyOn, setNotifyOn] = useState(
    typeof Notification !== "undefined" && Notification.permission === "granted"
  );
  const [notifyMsg, setNotifyMsg] = useState(null);
  const [showMeaning, setShowMeaning] = useState(true);
  const [activeTab, setActiveTab] = useState("all");
  const [modal, setModal] = useState(null); // null | "settings" | "stats"
  const [connState, setConnState] = useState("connecting"); // connecting | live | reconnecting
  const messagesRef = useRef(null);
  const esRef = useRef(null);
  const reconnectTimerRef = useRef(null);
  const reconnectAttemptsRef = useRef(0);
  const sinceRef = useRef("all");
  const loadedRef = useRef(false);
  const seenIdsRef = useRef(new Set());
  const isAtBottomRef = useRef(true);
  const topic = useRef(roomToTopic(room)).current;

  // ---- WebRTC voice call state ----
  const [callStatus, setCallStatus] = useState("idle"); // idle | outgoing | incoming | connecting | active
  const [incomingOffer, setIncomingOffer] = useState(null); // { callId, from, sdp }
  const [callError, setCallError] = useState(null);
  const [callNotice, setCallNotice] = useState(null);
  const [muted, setMuted] = useState(false);
  const [callPartner, setCallPartner] = useState(null);
  const pcRef = useRef(null);
  const localStreamRef = useRef(null);
  const remoteAudioRef = useRef(null);
  const callIdRef = useRef(null);
  const pendingCandidatesRef = useRef([]);
  const outgoingTimeoutRef = useRef(null);
  const hasConnectedRef = useRef(false);
  const [callRoute, setCallRoute] = useState(null); // null | "direct" | "relay"
  const [routeLog, setRouteLog] = useState([]);
  const routeSigRef = useRef(null);
  const callRouteIntervalRef = useRef(null);
  const handleSignalRef = useRef(null);

  // Turn one raw ntfy JSON line into a message we can render, and push it
  // into state. Shared by the initial history fetch and the live stream so
  // both paths behave identically.
  const processLine = useCallback((line) => {
    let obj;
    try { obj = JSON.parse(line); } catch (e) { return; }
    if (obj.event !== "message" || !obj.message) return;
    let payload;
    try {
      payload = JSON.parse(obj.message);
    } catch (e) {
      payload = { sender: "?", text: obj.message };
    }

    if (payload.kind === "call-signal") {
      // Skip signals replayed from history (initial /json?since=all fetch,
      // or a long-stalled reconnect) - only ever act on fresh signaling.
      const ageSec = obj.time ? (Date.now() / 1000 - obj.time) : 0;
      if (ageSec <= 30 && handleSignalRef.current) {
        handleSignalRef.current(payload);
      }
      return;
    }

    const msg = {
      id: obj.id,
      sender: payload.sender || "不明",
      text: payload.text || obj.message,
      ts: (obj.time || Date.now() / 1000) * 1000,
    };
    sinceRef.current = obj.id;

    let isNew = false;
    setMessages((prev) => {
      const base = prev || [];
      if (base.some((m) => m.id === msg.id)) return base;
      isNew = true;
      return [...base, msg].sort((a, b) => a.ts - b.ts).slice(-300);
    });

    if (isNew && loadedRef.current && msg.sender !== name &&
        (document.hidden || !document.hasFocus())) {
      playChime();
      if (typeof Notification !== "undefined" && Notification.permission === "granted") {
        try {
          const n = new Notification("たんご帳", {
            body: "新しい単語が追加されました",
            tag: `chat-${topic}`,
          });
          n.onclick = () => { window.focus(); };
        } catch (e) { /* ignore */ }
      }
    }
  }, [name, topic]);

  const loadHistory = useCallback(async () => {
    try {
      const url = `${NTFY_BASE}/${topic}/json?poll=1&since=all`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      text.split("\n").map((l) => l.trim()).filter(Boolean).forEach(processLine);
      setMessages((prev) => prev ?? []);
      setError(null);
    } catch (e) {
      const reason = e && e.message ? e.message : "通信エラー";
      setError(`読み込めませんでした（${reason}）。ネット接続を確認してください。`);
      setMessages((prev) => prev ?? []);
    }
  }, [topic, processLine]);

  // ---- WebRTC voice call: signaling helpers ----

  const sendCallMessage = useCallback((body) => {
    fetch(`${NTFY_BASE}/${topic}`, {
      method: "POST",
      headers: { "Content-Type": "text/plain; charset=utf-8" },
      body: JSON.stringify(body),
    }).catch(() => {});
  }, [topic]);

  const sendSignal = useCallback((type, extra = {}) => {
    sendCallMessage({
      kind: "call-signal",
      type,
      from: name,
      callId: callIdRef.current,
      ...extra,
    });
  }, [sendCallMessage, name]);

  const cleanupCall = useCallback(() => {
    if (outgoingTimeoutRef.current) {
      clearTimeout(outgoingTimeoutRef.current);
      outgoingTimeoutRef.current = null;
    }
    if (callRouteIntervalRef.current) {
      clearInterval(callRouteIntervalRef.current);
      callRouteIntervalRef.current = null;
    }
    if (pcRef.current) {
      pcRef.current.onicecandidate = null;
      pcRef.current.ontrack = null;
      pcRef.current.onconnectionstatechange = null;
      pcRef.current.close();
      pcRef.current = null;
    }
    if (localStreamRef.current) {
      localStreamRef.current.getTracks().forEach((t) => t.stop());
      localStreamRef.current = null;
    }
    if (remoteAudioRef.current) remoteAudioRef.current.srcObject = null;
    pendingCandidatesRef.current = [];
    callIdRef.current = null;
    hasConnectedRef.current = false;
    setIncomingOffer(null);
    setCallPartner(null);
    setMuted(false);
    setCallRoute(null);
    routeSigRef.current = null;
    setCallStatus("idle");
  }, []);

  // Figures out whether the active call is going peer-to-peer or being
  // relayed through the TURN server, by looking at which candidate pair
  // WebRTC actually selected for the connection.
  const checkCallRoute = useCallback(async (pc) => {
    try {
      const stats = await pc.getStats();
      let pairId = null;
      stats.forEach((r) => {
        if (r.type === "transport" && r.selectedCandidatePairId) pairId = r.selectedCandidatePairId;
      });
      if (!pairId) {
        stats.forEach((r) => {
          if (r.type === "candidate-pair" && (r.selected || (r.nominated && r.state === "succeeded"))) {
            pairId = r.id;
          }
        });
      }
      if (!pairId) return;
      const pair = stats.get(pairId);
      if (!pair) return;
      const local = stats.get(pair.localCandidateId);
      const remote = stats.get(pair.remoteCandidateId);
      const isRelay = (local && local.candidateType === "relay") || (remote && remote.candidateType === "relay");
      setCallRoute(isRelay ? "relay" : "direct");
      // ---- route log: 経路の詳細をログに出す(経路が変わったときだけ追記) ----
      const fmt = (c) => c
        ? `${c.candidateType}/${c.protocol}${c.relayProtocol ? "(" + c.relayProtocol + ")" : ""} ${c.address || c.ip || "?"}:${c.port ?? "?"}`
        : "?";
      const sig = `${isRelay}|${fmt(local)}|${fmt(remote)}`;
      if (sig !== routeSigRef.current) {
        const first = routeSigRef.current === null;
        routeSigRef.current = sig;
        const rtt = typeof pair.currentRoundTripTime === "number" ? `${Math.round(pair.currentRoundTripTime * 1000)}ms` : "-";
        const line = `${new Date().toLocaleTimeString("ja-JP", { hour12: false })} ${isRelay ? "中継経由" : "直接接続"} | 自分: ${fmt(local)} | 相手: ${fmt(remote)} | RTT ${rtt}`;
        console.log("[call-route]", line);
        setRouteLog((prev) => (first ? [line] : [...prev, line]).slice(-8));
      }
    } catch (e) { /* ignore - just don't show a route badge */ }
  }, []);

  const createPeerConnection = useCallback(() => {
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    // ---- 診断ログ: 接続前(失敗時)にも、ICE候補の収集結果とエラーを画面に出す ----
    routeSigRef.current = null;
    setRouteLog([]);
    const diag = (msg) => {
      const line = `${new Date().toLocaleTimeString("ja-JP", { hour12: false })} ${msg}`;
      console.log("[call-diag]", line);
      setRouteLog((prev) => [...prev, line].slice(-14));
    };
    const gathered = { host: 0, srflx: 0, relay: 0, prflx: 0 };
    pc.addEventListener("icecandidate", (e) => {
      if (e.candidate && e.candidate.type in gathered) gathered[e.candidate.type]++;
    });
    pc.addEventListener("icegatheringstatechange", () => {
      if (pc.iceGatheringState === "complete") {
        diag(`候補収集完了: host×${gathered.host} srflx×${gathered.srflx} relay×${gathered.relay}${gathered.relay === 0 ? " ← TURN候補なし(TURNに届いていない)" : ""}`);
      }
    });
    pc.addEventListener("icecandidateerror", (e) => {
      diag(`ICEエラー ${e.errorCode} ${e.url || ""} ${e.errorText || ""}`);
    });
    pc.addEventListener("iceconnectionstatechange", () => diag(`ICE状態: ${pc.iceConnectionState}`));
    pc.onicecandidate = (e) => {
      if (e.candidate) sendSignal("ice", { candidate: e.candidate.toJSON() });
    };
    pc.ontrack = (e) => {
      if (remoteAudioRef.current) remoteAudioRef.current.srcObject = e.streams[0];
    };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "connecting") {
        setCallStatus((s) => (s === "active" ? s : "connecting"));
      } else if (pc.connectionState === "connected") {
        if (outgoingTimeoutRef.current) {
          clearTimeout(outgoingTimeoutRef.current);
          outgoingTimeoutRef.current = null;
        }
        hasConnectedRef.current = true;
        setCallStatus("active");
        setCallNotice("通話が繋がりました");
        checkCallRoute(pc);
        if (callRouteIntervalRef.current) clearInterval(callRouteIntervalRef.current);
        // The selected route can in theory change mid-call (e.g. an ICE
        // restart), so keep re-checking every few seconds rather than once.
        callRouteIntervalRef.current = setInterval(() => checkCallRoute(pc), 5000);
      } else if (pc.connectionState === "failed") {
        setCallError(
          hasConnectedRef.current
            ? "通話が切断されました（接続が失われました）。"
            : "接続できませんでした。お互いのネットワーク環境が原因で繋がらない可能性があります。"
        );
        cleanupCall();
      }
    };
    return pc;
  }, [sendSignal, cleanupCall, checkCallRoute]);

  const startCall = useCallback(async () => {
    if (callStatus !== "idle") return;
    setCallError(null);
    setCallNotice(null);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      localStreamRef.current = stream;
      callIdRef.current = `${name}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      const pc = createPeerConnection();
      pcRef.current = pc;
      stream.getTracks().forEach((t) => pc.addTrack(t, stream));
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      setCallStatus("outgoing");
      sendSignal("offer", { sdp: pc.localDescription });
      // If nobody answers within 30s, stop ringing and tell the caller why.
      outgoingTimeoutRef.current = setTimeout(() => {
        outgoingTimeoutRef.current = null;
        sendSignal("end");
        setCallError("応答がありませんでした。相手が今この画面を開いていないか、電波・回線状況が原因の可能性があります。");
        cleanupCall();
      }, 30000);
    } catch (e) {
      setCallError("マイクを使用できませんでした。ブラウザの権限設定を確認してください。");
      cleanupCall();
    }
  }, [callStatus, createPeerConnection, sendSignal, cleanupCall, name]);

  const acceptCall = useCallback(async () => {
    if (!incomingOffer) return;
    setCallError(null);
    setCallNotice(null);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      localStreamRef.current = stream;
      callIdRef.current = incomingOffer.callId;
      const pc = createPeerConnection();
      pcRef.current = pc;
      stream.getTracks().forEach((t) => pc.addTrack(t, stream));
      await pc.setRemoteDescription(new RTCSessionDescription(incomingOffer.sdp));
      for (const c of pendingCandidatesRef.current) {
        try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) { /* ignore */ }
      }
      pendingCandidatesRef.current = [];
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      setCallPartner(incomingOffer.from);
      setIncomingOffer(null);
      // Not "active" yet - that's reserved for once ICE actually connects.
      setCallStatus("connecting");
      sendSignal("answer", { sdp: pc.localDescription });
    } catch (e) {
      setCallError("通話に応答できませんでした。");
      cleanupCall();
    }
  }, [incomingOffer, createPeerConnection, sendSignal, cleanupCall]);

  const declineCall = useCallback(() => {
    if (incomingOffer) {
      callIdRef.current = incomingOffer.callId;
      sendSignal("decline");
    }
    cleanupCall();
  }, [incomingOffer, sendSignal, cleanupCall]);

  const endCall = useCallback(() => {
    if (callIdRef.current) sendSignal("end");
    cleanupCall();
  }, [sendSignal, cleanupCall]);

  const toggleMute = useCallback(() => {
    if (!localStreamRef.current) return;
    const nextMuted = !muted;
    localStreamRef.current.getAudioTracks().forEach((t) => { t.enabled = !nextMuted; });
    setMuted(nextMuted);
  }, [muted]);

  // Incoming signaling messages (offers, answers, ICE candidates, hangups)
  // all arrive through the same ntfy topic as chat messages, tagged with
  // kind: "call-signal" so processLine can route them here instead of
  // treating them as vocab entries.
  const handleSignal = useCallback(async (payload) => {
    if (payload.from === name) return; // ignore our own message echoed back
    const { type, callId } = payload;

    if (type === "offer") {
      if (callStatus !== "idle") {
        sendCallMessage({ kind: "call-signal", type: "busy", from: name, callId });
        return;
      }
      setCallPartner(payload.from);
      setIncomingOffer({ callId, from: payload.from, sdp: payload.sdp });
      setCallStatus("incoming");
      return;
    }

    // Every other signal type belongs to a specific call; ignore anything
    // that isn't for the call we're currently in.
    if (callId !== callIdRef.current) return;

    if (type === "answer") {
      if (pcRef.current) {
        if (outgoingTimeoutRef.current) {
          clearTimeout(outgoingTimeoutRef.current);
          outgoingTimeoutRef.current = null;
        }
        await pcRef.current.setRemoteDescription(new RTCSessionDescription(payload.sdp));
        for (const c of pendingCandidatesRef.current) {
          try { await pcRef.current.addIceCandidate(new RTCIceCandidate(c)); } catch (e) { /* ignore */ }
        }
        pendingCandidatesRef.current = [];
        setCallPartner(payload.from);
        // Not "active" yet - that's reserved for once ICE actually connects.
        setCallStatus("connecting");
      }
      return;
    }

    if (type === "ice") {
      if (pcRef.current && pcRef.current.remoteDescription) {
        try { await pcRef.current.addIceCandidate(new RTCIceCandidate(payload.candidate)); } catch (e) { /* ignore */ }
      } else {
        pendingCandidatesRef.current.push(payload.candidate);
      }
      return;
    }

    if (type === "end") {
      setCallError("相手が通話を終了しました。");
      cleanupCall();
      return;
    }

    if (type === "decline") {
      setCallError("相手が通話に応答しませんでした。");
      cleanupCall();
      return;
    }

    if (type === "busy") {
      setCallError("相手は現在ほかの通話中です。");
      cleanupCall();
      return;
    }
  }, [callStatus, cleanupCall, name, sendCallMessage]);

  useEffect(() => { handleSignalRef.current = handleSignal; }, [handleSignal]);

  useEffect(() => {
    if (!callNotice) return;
    const t = setTimeout(() => setCallNotice(null), 4000);
    return () => clearTimeout(t);
  }, [callNotice]);

  useEffect(() => () => cleanupCall(), [cleanupCall]);

  // A single long-lived connection instead of polling every few seconds.
  // This is both lighter on ntfy.sh's shared servers (so it's less likely
  // to get rate-limited on a desktop tab that stays open for hours) and
  // recovers from drops on its own.
  const connectSSE = useCallback(() => {
    if (esRef.current) { esRef.current.close(); }
    clearTimeout(reconnectTimerRef.current);
    setConnState((prev) => (prev === "live" ? "reconnecting" : "connecting"));
    const url = `${NTFY_BASE}/${topic}/sse?since=${encodeURIComponent(sinceRef.current)}`;
    const es = new EventSource(url);
    esRef.current = es;
    es.onopen = () => {
      setConnState("live");
      reconnectAttemptsRef.current = 0;
      setError(null);
    };
    es.onmessage = (ev) => processLine(ev.data);
    es.onerror = () => {
      es.close();
      setConnState("reconnecting");
      reconnectAttemptsRef.current += 1;
      const delay = Math.min(2000 * reconnectAttemptsRef.current, 15000);
      reconnectTimerRef.current = setTimeout(connectSSE, delay);
    };
  }, [topic, processLine]);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      await loadHistory();
      if (cancelled) return;
      loadedRef.current = true;
      connectSSE();
    })();
    return () => {
      cancelled = true;
      clearTimeout(reconnectTimerRef.current);
      if (esRef.current) esRef.current.close();
    };
  }, [loadHistory, connectSSE]);

  // Some browsers silently pause a background tab's SSE connection
  // without ever firing onerror. Force a fresh connection whenever the
  // tab becomes visible again, so switching back after a while doesn't
  // leave you looking at a stalled, "disconnected" screen.
  useEffect(() => {
    const onWake = () => {
      if (!document.hidden) {
        const es = esRef.current;
        if (!es || es.readyState !== EventSource.OPEN) connectSSE();
      }
    };
    document.addEventListener("visibilitychange", onWake);
    window.addEventListener("focus", onWake);
    window.addEventListener("online", onWake);
    return () => {
      document.removeEventListener("visibilitychange", onWake);
      window.removeEventListener("focus", onWake);
      window.removeEventListener("online", onWake);
    };
  }, [connectSSE]);

  useEffect(() => {
    const el = messagesRef.current;
    if (el) {
      el.scrollTop = el.scrollHeight;
      isAtBottomRef.current = true;
    }
    // Mark everything as seen shortly after it's rendered on screen,
    // so the "unread" filter only reflects genuinely new items.
    if (messages && document.hasFocus() && !document.hidden) {
      const t = setTimeout(() => {
        messages.forEach((m) => seenIdsRef.current.add(m.id));
      }, 1200);
      return () => clearTimeout(t);
    }
  }, [messages]);

  // Chat text and Japanese translations are usually different lengths, so
  // switching "showMeaning" changes every row's height and therefore the
  // list's total scrollHeight. If the user was reading the latest entry
  // (bottom of the list), re-pin them to the (new) bottom so the toggle
  // doesn't visually scroll them "back" a little. useLayoutEffect runs
  // before the browser paints, so there's no visible jump either way.
  // If they'd scrolled up to read older entries, isAtBottomRef is false
  // and we leave their scroll position alone.
  useLayoutEffect(() => {
    const el = messagesRef.current;
    if (el && isAtBottomRef.current) {
      el.scrollTop = el.scrollHeight;
    }
  }, [showMeaning]);

  const requestNotify = async () => {
    if (typeof Notification === "undefined") {
      setNotifyMsg("この端末のブラウザは通知に対応していません。");
      return;
    }
    if (Notification.permission === "granted") {
      setNotifyOn((v) => !v);
      return;
    }
    const perm = await Notification.requestPermission();
    setNotifyOn(perm === "granted");
    setNotifyMsg(
      perm === "granted"
        ? "通知をオンにしました。このタブをブラウザで開いたままにしておいてください。"
        : "通知が許可されませんでした。ブラウザの設定から変更できます。"
    );
  };

  const handleSend = async () => {
    const text = draft.trim();
    if (!text || sending) return;
    setSending(true);
    try {
      const res = await fetch(`${NTFY_BASE}/${topic}`, {
        method: "POST",
        headers: { "Content-Type": "text/plain; charset=utf-8" },
        body: JSON.stringify({ sender: name, text }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      setDraft("");
      setError(null);
    } catch (e) {
      const reason = e && e.message ? e.message : "不明なエラー";
      setError(`送信できませんでした（${reason}）。ネット接続を確認してもう一度お試しください。`);
    } finally {
      setSending(false);
    }
  };

  const formatTime = (ts) => {
    const d = new Date(ts);
    return d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
  };

  const count = messages ? messages.length : 0;
  const level = Math.floor(count / 10) + 1;

  const filtered = useMemo(() => {
    const list = messages || [];
    switch (activeTab) {
      case "recent": return list.slice(-10);
      case "theirs": return list.filter((m) => m.sender !== name);
      case "mine": return list.filter((m) => m.sender === name);
      case "unread": return list.filter((m) => !seenIdsRef.current.has(m.id));
      default: return list;
    }
  }, [messages, activeTab, name]);

  const tabs = [
    { id: "all", label: "すべて" },
    { id: "recent", label: "あと一歩" },
    { id: "theirs", label: "苦手" },
    { id: "mine", label: "超苦手" },
    { id: "unread", label: "未出題" },
  ];

  return (
    <React.Fragment>
      <div className="top-bar">
        <button className="back-btn" onClick={onLeave}>‹</button>
        <input className="search-input" type="text" placeholder="英単語を検索…" value={draft}
          disabled={sending}
          onChange={(e) => setDraft(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") handleSend(); }}
          maxLength={500} />
      </div>

      {notifyMsg && <div className="notice-banner">{notifyMsg}</div>}
      {error && <div className="error-banner">{error}</div>}
      {callError && <div className="error-banner">{callError}</div>}
      {callNotice && <div className="notice-banner call-notice">✅ {callNotice}</div>}

      <audio ref={remoteAudioRef} autoPlay playsInline style={{ display: "none" }} />

      {(callStatus === "outgoing" || callStatus === "connecting" || callStatus === "active") && (
        <div className="call-bar">
          <span className={`call-bar-dot ${callStatus === "active" ? "connected" : ""}`} />
          <span className="call-bar-text">
            {callStatus === "outgoing" && `発信中… ${callPartner || ""}`}
            {callStatus === "connecting" && `接続中… ${callPartner || ""}`}
            {callStatus === "active" && (
              <>
                {`通話中 ${callPartner || ""}`}
                {callRoute && (
                  <span className={`call-route-badge ${callRoute}`}>
                    {callRoute === "relay" ? "中継経由" : "直接接続"}
                  </span>
                )}
              </>
            )}
          </span>
          {callStatus === "active" && (
            <button className="call-bar-btn" onClick={toggleMute}>
              {muted ? "🔇" : "🎙️"}
            </button>
          )}
          <button className="call-bar-btn hangup" onClick={endCall}>📵</button>
        </div>
      )}

      {routeLog.length > 0 && (
        <div className="route-log">
          <button onClick={() => setRouteLog([])}>✕</button>
          {routeLog.map((l, i) => <div key={i}>{l}</div>)}
        </div>
      )}

      <div className="action-row">
        <button className={`pill-btn show-toggle ${showMeaning ? "active" : ""}`}
          onClick={() => setShowMeaning((v) => !v)}>
          あ 日本語を表示
        </button>
        <button className="pill-btn" onClick={() => setModal("settings")}>
          ✎ ステータス編集
        </button>
      </div>

      {callStatus === "incoming" && incomingOffer && (
        <div className="sheet-backdrop">
          <div className="sheet call-sheet">
            <h2>📞 着信中…</h2>
            <p className="call-caller">着信があります</p>
            <div className="call-sheet-actions">
              <button className="btn-3d call-accept" onClick={acceptCall}>応答する</button>
              <button className="sheet-leave call-decline" onClick={declineCall}>拒否する</button>
            </div>
          </div>
        </div>
      )}

      <div className="tabs">
        {tabs.map((t) => (
          <button key={t.id} className={`tab ${activeTab === t.id ? "active" : ""}`}
            onClick={() => setActiveTab(t.id)}>
            {t.label}
          </button>
        ))}
      </div>

      <div className="messages" ref={messagesRef}
        onScroll={() => {
          const el = messagesRef.current;
          if (el) {
            isAtBottomRef.current = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
          }
        }}>
        {messages === null && <div className="empty-state">読み込み中…</div>}
        {messages !== null && filtered.length === 0 && (
          <div className="empty-state">
            まだ単語がありません。<br/>最初のひとことを送ってみましょう。
          </div>
        )}
        {messages !== null && filtered.map((m, i) => {
          const mine = m.sender === name;
          const word = wordFor(m.id);
          return (
            <div key={m.id} className="word-row">
              <div className="word-row-num">{i + 1}</div>
              <button className="speaker-btn" onClick={() => speak(word)}>🔊</button>
              <div className="word-row-main">
                <div className="word-row-english">{word}</div>
                {showMeaning
                  ? <div className="word-row-meaning">{meaningFor(m.id)}</div>
                  : <div className="word-row-meaning">{m.text}</div>}
              </div>
              <div className="word-row-status">
                <StatusIcon mine={mine} sender={m.sender} />
                <span className="word-row-time">{formatTime(m.ts)}</span>
              </div>
            </div>
          );
        })}
      </div>

      <div className="status-line">
        {connState === "live" && "リアルタイムで自動更新中"}
        {connState === "connecting" && "接続中…"}
        {connState === "reconnecting" && "接続が切れました。再接続しています…"}
      </div>

      <div className="bottom-nav">
        <button className="nav-btn active"
          onClick={() => { const el = messagesRef.current; if (el) el.scrollTop = el.scrollHeight; }}>
          🏠
        </button>
        <button className={`nav-btn ${callStatus !== "idle" ? "active" : ""}`}
          onClick={() => {
            if (callStatus === "idle") startCall();
            else if (callStatus === "outgoing" || callStatus === "connecting" || callStatus === "active") endCall();
          }}>
          🎧
        </button>
        <button className="nav-btn" onClick={() => setModal("stats")}>🏆</button>
        <button className="nav-btn" onClick={() => setModal("settings")}>👤</button>
        <button className="nav-btn" onClick={() => setModal("settings")}>⚙️</button>
      </div>

      {modal === "settings" && (
        <div className="sheet-backdrop" onClick={() => setModal(null)}>
          <div className="sheet" onClick={(e) => e.stopPropagation()}>
            <h2>ステータス編集</h2>
            <div className="sheet-row">
              <span>ニックネーム</span>
              <span className="sheet-value">{name}</span>
            </div>
            <div className="sheet-row">
              <span>教材コード</span>
              <span className="sheet-value">{room}</span>
            </div>
            <div className="sheet-row">
              <span>通知</span>
              <button className={`toggle-switch ${notifyOn ? "on" : ""}`} onClick={requestNotify} />
            </div>
            <button className="btn-3d sheet-close" onClick={() => setModal(null)}>閉じる</button>
            <button className="sheet-leave" onClick={onLeave}>この単語帳から退出する</button>
          </div>
        </div>
      )}

      {modal === "stats" && (
        <div className="sheet-backdrop" onClick={() => setModal(null)}>
          <div className="sheet" onClick={(e) => e.stopPropagation()}>
            <h2>ランキング</h2>
            <div className="stat-big">Lv.{level}</div>
            <div className="stat-sub">これまでに {count} 語を学習しました</div>
            <button className="btn-3d sheet-close" onClick={() => setModal(null)}>閉じる</button>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function App() {
  const [session, setSession] = useState(null);

  if (!session) {
    return (
      <div className="card">
        <Landing onJoin={(name, room) => setSession({ name, room })} />
      </div>
    );
  }

  return (
    <div className="card">
      <WordListRoom name={session.name} room={session.room} onLeave={() => setSession(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app-root")).render(<App />);
</script>
</body>
</html>
